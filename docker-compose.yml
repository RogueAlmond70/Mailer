services:
  mailer:
    build: .
    ports:
      - "8080:8080"
    environment:
      NATS_URL: nats://nats:4222
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: mailer
      POSTGRES_PASSWORD: mailer
      POSTGRES_DB_NAME: mailer
      POSTGRES_SSL_MODE: disable
      METRICS_ADDR: ":8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  nats:
    image: nats:2.11-alpine
    command: ["-js"]
    ports:
      - "4222:4222"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mailer
      POSTGRES_PASSWORD: mailer
      POSTGRES_DB: mailer
    ports:
      - "5432:5432"
    volumes:
      - mailer-postgres:/var/lib/postgresql/data
      - ./storage/sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./storage/sql/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailer -d mailer"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  mailer-postgres:
